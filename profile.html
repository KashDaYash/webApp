<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
  <title>RPG BattleBot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="profile.css"/>
</head>
<body>

  <div id="loadingScreen">
    <div class="spinner"></div>
  </div>

  <main id="app">
    
    <section id="tab-modes" class="page active-page">
      <div class="page-header"><h2>Battle Modes</h2></div>
      <div class="modes-container">
        <div class="mode-card" onclick="startBattle('pvm')">
          <div class="mode-icon">🌲</div>
          <h3>Adventure (PvM)</h3>
          <p>Fight Monsters</p>
        </div>
        <div class="mode-card" onclick="startBattle('pvp')">
          <div class="mode-icon">⚔️</div>
          <h3>Arena (PvP)</h3>
          <p>Matchmaking (±1 Lvl)</p>
        </div>
      </div>
      
      <div id="battleOverlay" class="hidden">
        <div class="battle-ui">
          <div class="enemy-display">
            <img id="enemyImg" src="">
            <h3 id="enemyName">Enemy</h3>
            <div class="hp-bar"><div id="enemyHpBar" style="width:100%"></div></div>
          </div>
          <div id="battleLog">Starting...</div>
          <button class="action-btn" onclick="performAttack()">⚔️ Attack</button>
          <button class="action-btn secondary" onclick="closeBattle()">🏃 Run</button>
        </div>
      </div>
    </section>

    <section id="tab-leaderboard" class="page">
      <div class="page-header"><h2>Leaderboard</h2></div>
      <div id="leaderboardList" class="list-container"></div>
    </section>

    <section id="tab-shop" class="page">
      <div class="page-header">
        <h2>Shop</h2>
        <div class="coin-balance">💰 <span id="shopCoins">0</span></div>
      </div>
      <div class="shop-tabs">
        <button class="shop-tab active" onclick="filterShop('Fruits')">Fruits</button>
        <button class="shop-tab" onclick="filterShop('Potions')">Potions</button>
        <button class="shop-tab" onclick="filterShop('Armor')">Armor</button>
        <button class="shop-tab" onclick="filterShop('Weapons')">Weapons</button>
      </div>
      <div id="shopGrid" class="shop-grid"></div>
    </section>

    <section id="tab-profile" class="page">
      <div class="profile-header-grid">
        <div class="ph-left">
          <img id="userAvatar" src="" alt="DP">
        </div>
        <div class="ph-center">
          <h2 id="userName">Name</h2>
          <span id="userHandle">@username</span>
        </div>
        <div class="ph-right">
          <button class="theme-toggle" onclick="toggleTheme()">
            <span id="themeIcon">🌙</span>
          </button>
        </div>
      </div>

      <div class="stats-card">
        <div class="stat-row">
          <span>❤️ HP</span> <span id="statHp">100</span>
        </div>
        <div class="stat-row">
          <span>⚔️ Attack</span> <span id="statAtk">10</span>
        </div>
        <div class="stat-row">
          <span>🛡️ Defense</span> <span id="statDef">5</span>
        </div>
        <div class="stat-row">
          <span>⚡ Speed</span> <span id="statSpd">10</span>
        </div>
      </div>

      <div class="xp-section">
        <div class="xp-info">
          <span>Lvl <span id="userLevel">1</span></span>
          <span id="xpText">0 / 100 XP</span>
        </div>
        <div class="xp-bar-bg"><div id="xpBarFill" class="xp-bar-fill"></div></div>
      </div>
    </section>

    <section id="tab-admin" class="page hidden">
      <div class="page-header"><h2>👑 Admin Panel</h2></div>
      <div class="admin-menu">
        <button onclick="adminAction('add_monster')">Add Monster</button>
        <button onclick="adminAction('add_item')">Add Shop Item</button>
        <button onclick="adminAction('gift_item')">Gift Item</button>
      </div>
    </section>

  </main>

  <nav class="bottom-nav">
    <div class="nav-item" onclick="switchTab('tab-modes', this)">
      <span class="material-icons-round">sports_esports</span>
    </div>
    <div class="nav-item" onclick="switchTab('tab-leaderboard', this)">
      <span class="material-icons-round">leaderboard</span>
    </div>
    <div class="nav-item" onclick="switchTab('tab-shop', this)">
      <span class="material-icons-round">storefront</span>
    </div>
    <div class="nav-item active" onclick="switchTab('tab-profile', this)">
      <span class="material-icons-round">person</span>
    </div>
    <div class="nav-item hidden" id="navAdmin" onclick="switchTab('tab-admin', this)">
      <span class="material-icons-round">admin_panel_settings</span>
    </div>
  </nav>

  <script src="profile.js"></script>
</body>
</html>
